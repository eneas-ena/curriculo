<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rede de Crianças — Igreja Vidas</title>
<meta name="theme-color" content="#0F1B33">
<link rel="icon" type="image/png" sizes="192x192" href="icone-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icone-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rede de Crianças">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===================================================================
   REDE DE CRIANÇAS
   A cor carrega a informação: cada faixa é um estrato de profundidade,
   do mais claro (Berçário, perceber) ao mais fundo (Juniores, convicção).
   =================================================================== */
:root{
  --f1:#DCE6F0; --f2:#A9C2DC; --f3:#6E93BA; --f4:#38598C; --f5:#0F1B33;
  --f1-ink:#0F1B33; --f2-ink:#0F1B33; --f3-ink:#FFFFFF; --f4-ink:#FFFFFF; --f5-ink:#FFFFFF;

  --paper:#E9EDF2;
  --surface:#FFFFFF;
  --ink:#16223A;
  --ink-soft:#5A6982;
  --line:#CFD8E3;
  --gold:#C9A227;
  --gold-deep:#9C7C15;
  --rust:#A8552F;

  --display:'Cormorant Garamond',Georgia,serif;
  --body:'Karla',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;

  --r:10px;
  --shadow:0 1px 2px rgba(15,27,51,.06), 0 8px 24px -12px rgba(15,27,51,.18);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--body); font-size:16px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- estrutura ---------- */
.topbar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:14px;
  padding:12px 20px;
  background:var(--f5);color:#fff;
  border-bottom:2px solid var(--gold);
}
.topbar .mark{
  font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:.02em;
  line-height:1.1;
}
.topbar .mark small{
  display:block;font-family:var(--mono);font-size:9.5px;font-weight:500;
  letter-spacing:.22em;text-transform:uppercase;color:#9FB3CE;margin-top:2px;
}
.topbar .spacer{flex:1}
.chip{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  padding:5px 10px;border:1px solid rgba(255,255,255,.28);border-radius:999px;color:#CBD8E8;
  background:transparent;
}
.chip.gold{border-color:var(--gold);color:var(--gold)}
.wrap{max-width:1060px;margin:0 auto;padding:26px 20px 72px}

.crumb{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-soft);margin-bottom:18px;
}
.crumb button{background:none;border:0;padding:0;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px}
.crumb button:hover{color:var(--ink)}
.crumb span.sep{opacity:.45}

h1{font-family:var(--display);font-weight:600;font-size:clamp(28px,5vw,40px);line-height:1.1;margin:0 0 6px}
h2{font-family:var(--display);font-weight:600;font-size:24px;margin:0 0 4px;line-height:1.2}
.lede{color:var(--ink-soft);max-width:60ch;margin:0 0 26px}
.eyebrow{
  font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink-soft);margin:0 0 10px;
}

/* ---------- assinatura: os cinco estratos ---------- */
.strata{border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line)}
.stratum{
  display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:18px;
  width:100%;text-align:left;border:0;border-bottom:1px solid rgba(15,27,51,.10);
  padding:20px 22px;transition:padding .18s ease, filter .18s ease;
}
.stratum:last-child{border-bottom:0}
.stratum:hover,.stratum:focus-visible{padding-top:28px;padding-bottom:28px;filter:saturate(1.12)}
.stratum .verbo{
  font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  writing-mode:vertical-rl;transform:rotate(180deg);opacity:.72;justify-self:center;
}
.stratum .nome{font-family:var(--display);font-size:26px;font-weight:600;line-height:1.15}
.stratum .idade{font-size:13.5px;opacity:.78;margin-top:1px}
.stratum .pergunta{font-size:13px;opacity:.66;font-style:italic;margin-top:6px;display:none}
.stratum:hover .pergunta,.stratum:focus-visible .pergunta{display:block}
.stratum .prog{font-family:var(--mono);font-size:12px;letter-spacing:.06em;opacity:.8;text-align:right;white-space:nowrap}
.s1{background:var(--f1);color:var(--f1-ink)}
.s2{background:var(--f2);color:var(--f2-ink)}
.s3{background:var(--f3);color:var(--f3-ink)}
.s4{background:var(--f4);color:var(--f4-ink)}
.s5{background:var(--f5);color:var(--f5-ink)}

/* ---------- trimestres ---------- */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 22px}
.tab{
  background:transparent;border:1px solid var(--line);border-radius:999px;
  padding:8px 15px;font-size:13.5px;font-weight:500;color:var(--ink-soft);
}
.tab[aria-selected="true"]{background:var(--f5);border-color:var(--f5);color:#fff}
.tab .n{font-family:var(--mono);font-size:11px;opacity:.7;margin-right:6px}

/* ---------- grade de domingos ---------- */
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:12px}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 16px 14px;text-align:left;width:100%;
  display:flex;flex-direction:column;gap:7px;min-height:132px;
  transition:border-color .15s ease, transform .15s ease;
}
.card:hover{border-color:var(--f4);transform:translateY(-2px)}
.card .num{
  font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--ink-soft);
  display:flex;align-items:center;justify-content:space-between;
}
.card .tit{font-family:var(--display);font-size:19px;font-weight:600;line-height:1.2}
.card .ref{font-family:var(--mono);font-size:11.5px;color:var(--f4)}
.card .vc{font-size:12.5px;color:var(--ink-soft);line-height:1.45;flex:1}
.card.extra{border-style:dashed;border-color:var(--gold)}
.card.extra .num{color:var(--gold-deep)}

.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.pendente{background:var(--line)}
.dot.gerada{background:var(--f3)}
.dot.aprovada{background:var(--gold)}
.dot.publicada{background:#2E7D5B}

/* ---------- ficha da lição ---------- */
.ficha{display:grid;grid-template-columns:1fr 300px;gap:22px;align-items:start}
@media (max-width:860px){.ficha{grid-template-columns:1fr}}
.bloco{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:20px 22px;margin-bottom:14px;
}
.bloco h3{
  font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink-soft);margin:0 0 10px;font-weight:600;
  display:flex;align-items:center;gap:9px;
}
.bloco h3::before{
  content:attr(data-n);font-size:10px;color:var(--gold-deep);
  border:1px solid var(--line);border-radius:4px;padding:1px 5px;
}
.bloco p{margin:0 0 10px;white-space:pre-wrap}
.bloco p:last-child{margin-bottom:0}
.bloco ul{margin:0;padding-left:19px}
.bloco li{margin-bottom:5px}
.destaque{
  border-left:3px solid var(--gold);background:#FBF6E6;
  padding:14px 16px;border-radius:0 var(--r) var(--r) 0;margin-bottom:14px;
}
.destaque .rot{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-deep)}
.destaque .txt{font-family:var(--display);font-size:20px;line-height:1.35;margin-top:3px}
.meta{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:14px}
.meta dt{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);padding-top:3px}
.meta dd{margin:0}

/* ---------- materiais ---------- */
.mat{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:12px;background:var(--surface)}
.mat .cab{display:flex;align-items:center;gap:9px;padding:11px 14px;border-bottom:1px solid var(--line)}
.mat .cab .tipo{font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:#fff;background:var(--f4);padding:3px 7px;border-radius:3px}
.mat .cab .tit{font-weight:600;font-size:14px;flex:1;line-height:1.25}
.mat .prev{background:#fff;padding:12px;display:flex;align-items:center;justify-content:center;min-height:130px}
.mat .prev svg,.mat .prev img{max-width:100%;max-height:230px;height:auto}
.mat .pe{padding:11px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line)}
.selo{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;padding:3px 8px;border-radius:999px}
.selo.prov{color:var(--rust);border:1px solid var(--rust)}
.selo.def{color:#2E7D5B;border:1px solid #2E7D5B}
.selo.folha{color:var(--f4);border:1px solid var(--f4)}

/* ---------- botões ---------- */
.btn{
  background:var(--f5);color:#fff;border:1px solid var(--f5);border-radius:7px;
  padding:9px 16px;font-size:14px;font-weight:600;
}
.btn:hover{background:#1B2C4C}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:#fff;border-color:var(--f4)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#2A2004}
.btn.gold:hover{background:var(--gold-deep);color:#fff}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* ---------- estados vazios ---------- */
.vazio{
  border:1px dashed var(--line);border-radius:var(--r);background:rgba(255,255,255,.55);
  padding:38px 26px;text-align:center;
}
.vazio .t{font-family:var(--display);font-size:22px;font-weight:600;margin-bottom:5px}
.vazio .d{color:var(--ink-soft);max-width:46ch;margin:0 auto 16px;font-size:14.5px}

/* ---------- PIN ---------- */
.porta{min-height:100dvh;display:grid;place-items:center;padding:24px;background:var(--f5)}
.porta .caixa{width:100%;max-width:372px;text-align:center;color:#fff}
.porta .selo-abre{
  font-family:var(--mono);font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)
}
.porta h1{color:#fff;margin:12px 0 4px}
.porta .sub{color:#9FB3CE;font-size:14px;margin-bottom:26px}
.porta input{
  width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.24);
  color:#fff;border-radius:9px;padding:15px;text-align:center;
  font-family:var(--mono);font-size:26px;letter-spacing:.5em;text-indent:.5em;
}
.porta input:focus{outline:2px solid var(--gold);outline-offset:2px}
.porta .btn{width:100%;margin-top:12px;background:var(--gold);border-color:var(--gold);color:#2A2004;padding:13px}
.porta .erro{color:#F2B8A2;font-size:13.5px;margin-top:12px;min-height:20px}

/* ---------- tabela da grade ---------- */
.tab-grade{width:100%;border-collapse:collapse;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tab-grade td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.tab-grade tr:last-child td{border-bottom:0}
.tab-grade tr.sub td{
  background:#F4F7FA;font-family:var(--mono);font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-soft);padding:8px 14px;
}
.tab-grade td.nu{font-family:var(--mono);font-size:12px;color:var(--f4);width:1%;white-space:nowrap;padding-top:13px}
.tab-grade td.rr{font-family:var(--mono);font-size:12px;color:var(--ink-soft);white-space:nowrap;width:1%;padding-top:13px}
.tab-grade td.aa{width:1%;white-space:nowrap;text-align:right}
.tab-grade .tt{display:block;font-weight:600;font-size:14.5px;line-height:1.3}
.tab-grade .vv{display:block;font-size:13px;color:var(--ink-soft);margin-top:2px;line-height:1.4}
.tab-grade tr.edit td{background:#F9FBFD}
.tab-grade tr.edit label{display:block;margin-bottom:9px;font-family:var(--mono);
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.tab-grade tr.edit input,.tab-grade tr.edit textarea{
  display:block;width:100%;margin-top:4px;font:inherit;font-size:14.5px;
  padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);
  text-transform:none;letter-spacing:normal;
}
@media (max-width:640px){
  .tab-grade td.rr{white-space:normal}
  .tab-grade td,.tab-grade tr.sub td{padding-left:10px;padding-right:10px}
}

/* ---------- marca ---------- */
.brasao{width:34px;height:34px;border-radius:8px;flex:none;display:block}
.brasao-grande{
  width:104px;height:104px;border-radius:22px;display:block;margin:0 auto 20px;
  box-shadow:0 10px 34px -10px rgba(0,0,0,.6);
}

/* ---------- fila de geração ---------- */
.barra{height:6px;background:var(--line);border-radius:999px;overflow:hidden;margin:18px 0 12px}
.barra > div{height:100%;width:0;background:var(--gold);transition:width .3s ease}
.registro{
  background:var(--f5);color:#BFD0E4;border-radius:var(--r);padding:16px;
  font-family:var(--mono);font-size:12px;line-height:1.7;
  max-height:340px;overflow:auto;white-space:pre-wrap;margin:0;
}

#falha{
  position:fixed;left:0;right:0;bottom:0;z-index:99;
  background:var(--rust);color:#fff;padding:12px 18px;cursor:pointer;
  font-family:var(--mono);font-size:12px;line-height:1.5;
  padding-bottom:calc(12px + env(safe-area-inset-bottom));
}

/* ===================================================================
   IMPRESSÃO — o navegador gera o PDF. No Mac: PDF → Salvar como PDF.
   =================================================================== */
#imprimir{display:none}

@media print{
  @page{ size:A4 portrait; margin:14mm 15mm; }
  body{background:#fff;color:#000;font-size:11.5pt}
  body > *{display:none !important}
  #imprimir{display:block !important}

  .pagina{page-break-after:always;break-after:page}
  .pagina:last-child{page-break-after:auto;break-after:auto}

  .cab-p{
    display:flex;justify-content:space-between;align-items:baseline;
    border-bottom:1.5pt solid #000;padding-bottom:4pt;margin-bottom:14pt;
    font-size:8.5pt;letter-spacing:.09em;text-transform:uppercase;
  }
  .pagina h1{
    font-family:'Cormorant Garamond',Georgia,serif;font-size:22pt;
    line-height:1.15;margin:0 0 3pt;
  }
  .pagina .ref-p{font-size:10pt;font-style:italic;margin:0 0 14pt}
  .vc-p{border:1.2pt solid #000;padding:8pt 11pt;margin-bottom:14pt}
  .vc-p .r{font-size:8pt;letter-spacing:.14em;text-transform:uppercase}
  .vc-p .t{font-family:'Cormorant Garamond',Georgia,serif;font-size:15pt;line-height:1.3}
  .sec-p{margin-bottom:11pt;page-break-inside:avoid;break-inside:avoid}
  .sec-p h2{
    font-size:8.5pt;letter-spacing:.13em;text-transform:uppercase;
    margin:0 0 3pt;padding-bottom:2pt;border-bottom:.6pt solid #999;
  }
  .sec-p p{margin:0;white-space:pre-wrap;line-height:1.45}
  .sec-p ul{margin:3pt 0 0;padding-left:14pt}
  .grade-p{display:grid;grid-template-columns:auto 1fr;gap:3pt 10pt;font-size:10.5pt}
  .grade-p dt{font-size:8pt;letter-spacing:.1em;text-transform:uppercase;padding-top:2pt}
  .grade-p dd{margin:0}
  .arte-p{text-align:center;margin:0}
  .arte-p svg,.arte-p img{max-width:100%;max-height:225mm;height:auto}
  .rod-p{
    position:running(rodape);margin-top:14pt;padding-top:5pt;border-top:.6pt solid #999;
    font-size:8pt;text-align:center;
  }
  .cartao-p{
    border:1.2pt dashed #000;padding:12pt 14pt;margin-bottom:10pt;
    page-break-inside:avoid;break-inside:avoid;
  }
  .linhas-p{margin-top:10pt}
  .linhas-p div{border-bottom:.8pt solid #000;height:9mm}
}

/* ---------- utilidades ---------- */
.aviso{
  background:#FBF6E6;border:1px solid #E6D8A8;border-left:3px solid var(--gold);
  border-radius:0 var(--r) var(--r) 0;padding:14px 16px;margin-bottom:20px;font-size:14px;
}
.aviso strong{display:block;margin-bottom:3px}
.linha{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
.carregando{text-align:center;padding:56px;color:var(--ink-soft);font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase}
.oculto{display:none!important}
</style>

/* ---------- portaria ---------- */
function renderPorta(){
  app.innerHTML = `
  <div class="porta"><div class="caixa">
    <img class="brasao-grande" src="icone-512.png" alt="">
    <div class="selo-abre">Igreja Vidas · Departamento Infantil</div>
    <h1>Rede de Crianças</h1>
    <p class="sub">Informe seu PIN para entrar.</p>
    <input id="pin" type="password" inputmode="numeric" maxlength="8"
           autocomplete="off" aria-label="PIN de acesso">
    <button class="btn" id="entrar">Entrar</button>
    <p class="erro" id="erro" role="alert"></p>
  </div></div>`;

  const entrar = () => {
    const v = $('#pin').value.trim();
    if (v === CONFIG.PIN_ADMIN){
      estado.papel = 'admin'; estado.faixaPin = null;
      localStorage.setItem('rc_papel','admin'); localStorage.removeItem('rc_faixa');
      return ir('inicio');
    }
    if (v === CONFIG.PIN_SUPERVISAO){
      estado.papel = 'supervisao'; estado.faixaPin = null;
      localStorage.setItem('rc_papel','supervisao'); localStorage.removeItem('rc_faixa');
      return ir('inicio');
    }
    const achou = Object.entries(CONFIG.PIN_FAIXA).find(([,p]) => p === v);
    if (achou){
      estado.papel = 'professor'; estado.faixaPin = achou[0];
      localStorage.setItem('rc_papel','professor'); localStorage.setItem('rc_faixa',achou[0]);
      estado.faixa = achou[0];
      return ir('faixa');
    }
    $('#erro').textContent = 'PIN não reconhecido. Confira com a liderança do departamento.';
    $('#pin').value = ''; $('#pin').focus();
  };
  $('#entrar').onclick = entrar;
  $('#pin').onkeydown = e => { if (e.key === 'Enter') entrar(); };
  $('#pin').focus();
}

    ? '<span class="chip">Supervisão</span>'

  const crumb = migalhas.length ? `<nav class="crumb">${
      migalhas.map((m,i) => i === migalhas.length-1
        ? `<span>${esc(m.t)}</span>`

      ).join('')}</nav>` : '';
  app.innerHTML = `
    <header class="topbar">
      <img class="brasao" src="icone-192.png" alt="">

/* ---------- tela: faixa ---------- */
async function renderFaixa(){
  const f = faixaPor(estado.faixa);
  if (!f) return ir('inicio');
  const unidades = await carregarUnidades();
  const t = TRIMESTRES.find(t => t.id === estado.trimestre);

  let doTri = unidades.filter(u =>
    u.tipo === 'ciclo' && u.numero >= t.faixa[0] && u.numero <= t.faixa[1]);
  // O Berçário tem uma lição por bloco de quatro domingos.
  if (f.id === 1) doTri = doTri.filter(u => faixasDaUnidade(u).includes(1));
  const extras = unidades.filter(u => u.tipo === 'extra');

  const cartao = u => {
    const l = (u.licoes || []).find(x => x.faixa_id === f.id);
    const st = l?.status || 'pendente';
    let rot = u.tipo === 'extra'
      ? (EXTRAS.find(e => e.slug === u.extra_slug)?.nome || 'Extra').toUpperCase()
      : `Domingo ${pad(u.numero)}`;
    if (f.id === 1 && u.tipo === 'ciclo'){
      const pos = u.numero - t.faixa[0];
      rot = pos === 12 ? `Domingo ${pad(u.numero)} · revisão`
                       : `Domingos ${pad(u.numero)}–${pad(u.numero+3)}`;
    }
    return `<button class="card ${u.tipo === 'extra' ? 'extra' : ''}"
              data-ir="licao" data-arg="${u.id}">
      <span class="num">${esc(rot)}<span class="dot ${st}" title="${st}"></span></span>
      <span class="tit">${esc(l?.tema || u.titulo)}</span>
      <span class="ref">${esc(u.texto_biblico)}</span>
      <span class="vc">${esc(u.verdade_central || '')}</span>
    </button>`;
  };

  const grade = doTri.length
    ? `<div class="grade">${doTri.map(cartao).join('')}</div>`
    : vazioGrade();

  moldura(`
    <div style="background:var(--f${f.id});color:var(--f${f.id}-ink);
                border-radius:var(--r);padding:22px 24px;margin-bottom:24px">
      <p class="eyebrow" style="color:inherit;opacity:.7">${esc(f.verbo)} · ${esc(f.duracao)}</p>
      <h1 style="margin:0">${esc(f.nome)}</h1>
      <p style="margin:4px 0 0;opacity:.82">${esc(f.idade)} — “${esc(f.pergunta)}”</p>
    </div>
    <div class="tabs" role="tablist">${
      TRIMESTRES.map(x => `<button class="tab" role="tab"
        aria-selected="${x.id === estado.trimestre}" data-tri="${x.id}">
        <span class="n">${pad(x.faixa[0])}–${pad(x.faixa[1])}</span>${esc(x.tema)}</button>`).join('')}
    </div>
    ${grade}
    <div class="linha" style="margin:18px 0 0">
      <button class="btn ghost" id="imp-tri">Imprimir o trimestre inteiro</button>
    </div>
    ${extras.length ? `
      <p class="eyebrow" style="margin-top:34px">Datas especiais · substituem qualquer domingo</p>
      <div class="grade">${extras.map(cartao).join('')}</div>` : ''}
  `, [ {t:'Início', ir:'inicio'}, {t:f.nome} ]);

  app.querySelectorAll('[data-tri]').forEach(b => {
    b.onclick = () => { estado.trimestre = +b.dataset.tri; renderFaixa(); };
  });
  const btnTri = $('#imp-tri');
  if (btnTri) btnTri.onclick = async () => {
    btnTri.disabled = true; btnTri.textContent = 'Montando…';
    try{ await imprimirTrimestre(f, estado.trimestre); }
    catch(e){ alert('Não foi possível montar: ' + e.message); }
    btnTri.disabled = false; btnTri.textContent = 'Imprimir o trimestre inteiro';
  };
}

async function enviarArte(materialId, file){
  if (!file) return;
  const ext = (file.name.split('.').pop() || 'png').toLowerCase();
  const caminho = `materiais/${materialId}.${ext}`;
  const { error } = await sb.storage.from('rede-criancas')
    .upload(caminho, file, { upsert:true, contentType:file.type });
  if (error){ alert('Não foi possível enviar a arte: ' + error.message); return; }
  const { data:{ publicUrl } } = sb.storage.from('rede-criancas').getPublicUrl(caminho);
  await sb.from('materiais').update({
    imagem_url: publicUrl + '?v=' + Date.now(),
    imagem_status: 'definitivo',
    atualizado_em: new Date().toISOString()
  }).eq('id', materialId);
  renderLicao();
}

/* --- texto bíblico (Bíblia Livre, domínio público) --- */
let LIVROS_BIBLIA = null;
const normalizar = s => String(s||'').toLowerCase()
  .normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[\s.]+/g,'');

async function livrosBiblia(){
  if (LIVROS_BIBLIA) return LIVROS_BIBLIA;
  const { data, error } = await sbBiblia.from('livros').select('*').order('ordem_canonica');
  if (error) throw new Error('Banco bíblico: ' + error.message);
  LIVROS_BIBLIA = data || [];
  return LIVROS_BIBLIA;
}

/* "Gênesis 1.26-31; 2.7" → [{livro, cap, vIni, vFim}, ...] */
function lerReferencia(ref, livros){
  const partes = String(ref).split(';').map(p => p.trim()).filter(Boolean);
  const saida = []; let ultimo = null;

  for (const parte of partes){
    let m = parte.match(/^(.+?)\s+(\d+)(?:[.:](\d+)(?:\s*[-–]\s*(\d+))?)?$/);
    let nome, cap, v1, v2;
    if (m && !/^\d/.test(m[1].trim().replace(/^[1-3]\s*/,''))){
      nome = m[1].trim(); cap = +m[2]; v1 = m[3] ? +m[3] : null; v2 = m[4] ? +m[4] : null;
    } else {
      m = parte.match(/^(\d+)[.:](\d+)(?:\s*[-–]\s*(\d+))?$/);
      if (!m || !ultimo) continue;
      nome = ultimo.nome; cap = +m[1]; v1 = +m[2]; v2 = m[3] ? +m[3] : null;
    }
    const alvo = normalizar(nome);
    const livro = livros.find(l => normalizar(l.nome) === alvo)
               || livros.find(l => normalizar(l.abrev) === alvo)
               || livros.find(l => normalizar(l.nome).startsWith(alvo));
    if (!livro) throw new Error(`Livro não encontrado na referência "${parte}".`);
    ultimo = { nome };
    saida.push({ livro, cap, vIni: v1, vFim: v2 || v1 });
  }
  if (!saida.length) throw new Error(`Referência não compreendida: "${ref}".`);
  return saida;
}

async function buscarPassagem(ref){
  const livros = await livrosBiblia();
  const trechos = lerReferencia(ref, livros);
  const blocos = [];
  for (const t of trechos){
    let q = sbBiblia.from('versiculos').select('versiculo,texto')
      .eq('versao_id', CONFIG.BIBLIA.VERSAO_ID)
      .eq('livro_id', t.livro.id).eq('capitulo', t.cap);
    if (t.vIni) q = q.gte('versiculo', t.vIni).lte('versiculo', t.vFim);
    const { data, error } = await q.order('versiculo');
    if (error) throw new Error('Banco bíblico: ' + error.message);
    if (!data?.length) throw new Error(`Sem texto para ${t.livro.nome} ${t.cap}.`);
    blocos.push(`${t.livro.nome} ${t.cap}\n` +
      data.map(v => `${v.versiculo}. ${v.texto}`).join('\n'));
  }
  return blocos.join('\n\n');
}

/* Diz o que falta para o motor funcionar, ou null se estiver pronto. */
function motorPronto(){
  if (!CONFIG.WORKER_URL || CONFIG.WORKER_URL.includes('SEU-WORKER'))
    return 'O motor de geração ainda não foi ligado.\n\nPublique o worker.js no Cloudflare '
         + 'e cole o endereço dele em CONFIG.WORKER_URL, dentro do index.html.';
  if (!CONFIG.BIBLIA.VERSAO_ID)
    return 'Falta indicar a versão bíblica em CONFIG.BIBLIA.VERSAO_ID.';
  return null;
}

/* --- chamada ao motor --- */
async function chamarIA(system, prompt, maxTokens){
  const r = await fetch(CONFIG.WORKER_URL, {
    method:'POST', headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ pin: CONFIG.PIN_ADMIN, system, prompt,
                           max_tokens: maxTokens, model: CONFIG.MODELO })
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.erro || `Motor de geração respondeu ${r.status}.`);
  if (!d.texto) throw new Error('O motor devolveu uma resposta vazia.');
  return d.texto;
}

function extrairJSON(txt){
  let t = txt.trim().replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();
  const i = t.indexOf('{'), f = t.lastIndexOf('}');
  if (i === -1 || f === -1) throw new Error('A resposta não veio em JSON.');
  return JSON.parse(t.slice(i, f+1));
}

/* --- quais lições cada unidade exige --- */
function faixasDaUnidade(u){
  if (u.tipo === 'extra') return FAIXAS.map(f => f.id);
  const t = TRIMESTRES.find(x => u.numero >= x.faixa[0] && u.numero <= x.faixa[1]);
  const pos = u.numero - t.faixa[0];             // 0..12
  const cabecaDeBloco = pos % 4 === 0 && pos < 12;
  const revisao = pos === 12;
  // O Berçário só recebe lição na abertura do bloco e na revisão:
  // nos outros três domingos a turma repete a mesma experiência.
  return (cabecaDeBloco || revisao) ? [1,2,3,4,5] : [2,3,4,5];
}

/* Lê o formato delimitado. Aspas não têm significado aqui, então um SVG
   malformado não derruba os demais materiais. */
function lerMateriais(txt){
  const saida = [];
  const blocos = String(txt).split('===MATERIAL===').slice(1);
  for (const bruto of blocos){
    const corpo = bruto.split('===FIM===')[0];
    const campo = rot => {
      const m = corpo.match(new RegExp('^\\s*' + rot + ':\\s*(.+)$', 'mi'));
      return m ? m[1].trim() : '';
    };
    const iSvg = corpo.search(/^\s*SVG:\s*$/mi);
    let svg = null;
    if (iSvg !== -1){
      const cru = corpo.slice(iSvg).replace(/^\s*SVG:\s*/i, '');
      svg = limparSVG(cru);
    }
    const titulo = campo('TITULO');
    if (!titulo && !svg) continue;
    const ilustracao = /ilustra/i.test(campo('CLASSE'));
    saida.push({
      tipo: (campo('TIPO') || (ilustracao ? 'colorir' : 'folha')).toLowerCase().split(/[\s,]/)[0],
      titulo: titulo || 'Material',
      instrucoes: campo('INSTRUCOES'),
      // Só a ilustração pode ser trocada por arte externa. Uma folha de
      // atividade carrega o conteúdo didático e não se substitui por imagem.
      prompt_imagem: ilustracao ? campo('PROMPT') : null,
      svg
    });
  }
  return saida;
}

const TIPOS_MATERIAL = ['colorir','dobradura','colagem','jogo','cartao','folha','recortavel','mapa'];

/* Gera (ou regera) apenas os materiais de uma lição já escrita. */
async function gerarMateriais(u, faixa, licao, licaoId, registrar){
  const bruto = await chamarIA(PERFIL, promptMateriais(u, faixa, licao), 16000);
  const lista = lerMateriais(bruto).slice(0,3).map((m,i) => ({
    licao_id: licaoId,
    tipo: TIPOS_MATERIAL.includes(m.tipo) ? m.tipo : 'folha',
    titulo: m.titulo, instrucoes: m.instrucoes,
    svg: m.svg, prompt_imagem: m.prompt_imagem,
    imagem_status: 'provisorio', ordem: i+1
  }));
  if (!lista.length) throw new Error('O motor não devolveu nenhum material legível.');

  const semDesenho = lista.filter(m => !m.svg).length;
  if (semDesenho) registrar(`   ${semDesenho} material(is) sem desenho provisório — `
    + `o prompt para a arte definitiva foi salvo do mesmo jeito`);

  await sb.from('materiais').delete().eq('licao_id', licaoId);
  const { error } = await sb.from('materiais').insert(lista);
  if (error) throw new Error('Ao salvar os materiais: ' + error.message);
  registrar(`   ${lista.length} materiais salvos`);
  return lista.length;
}

/* --- geração de uma lição --- */
async function gerarLicao(u, faixa, registrar){
  const tema = TRIMESTRES.find(t => t.id === u.trimestre_id)?.tema || '';
  registrar(`${u.tipo === 'extra' ? 'Extra' : 'Domingo ' + pad(u.numero)} · ${faixa.nome}: buscando o texto`);
  const passagem = await buscarPassagem(u.texto_biblico);

  registrar(`${u.tipo === 'extra' ? 'Extra' : 'Domingo ' + pad(u.numero)} · ${faixa.nome}: escrevendo a lição`);
  const bruto = await chamarIA(PERFIL, promptLicao(u, faixa, passagem, tema), 5000);
  const L = extrairJSON(bruto);

  const registro = {
    unidade_id: u.id, faixa_id: faixa.id,
    tema: L.tema || u.titulo,
    texto_biblico: u.texto_biblico,
    verdade_central: u.verdade_central,
    objetivo: L.objetivo, versiculo_ref: L.versiculo_ref, versiculo_texto: L.versiculo_texto,
    chave_metodologica: L.chave_metodologica, duracao: L.duracao,
    recursos_didaticos: L.recursos_didaticos || [],
    preparacao_professor: L.preparacao_professor,
    acolhimento: L.acolhimento, introducao: L.introducao, ensino_biblico: L.ensino_biblico,
    atividade_fixacao: L.atividade_fixacao, aplicacao_pratica: L.aplicacao_pratica,
    oracao: L.oracao, desafio_semana: L.desafio_semana, desafio_familia: L.desafio_familia,
    orientacoes_professor: L.orientacoes_professor || [],
    status: 'gerada', modelo_ia: CONFIG.MODELO,
    gerada_em: new Date().toISOString(), atualizado_em: new Date().toISOString()
  };

  const { data: salva, error } = await sb.from('licoes')
    .upsert(registro, { onConflict:'unidade_id,faixa_id' }).select('id').single();
  if (error) throw new Error('Ao salvar a lição: ' + error.message);

  registrar(`${u.tipo === 'extra' ? 'Extra' : 'Domingo ' + pad(u.numero)} · ${faixa.nome}: desenhando os materiais`);
  try{
    await gerarMateriais(u, faixa, L, salva.id, registrar);
  }catch(e){
    registrar(`   ⚠ materiais falharam: ${e.message}`);
    registrar(`   a lição foi salva — use "Gerar materiais" na tela dela para tentar de novo`);
  }
  return salva.id;
}

/* Remove qualquer coisa executável do SVG antes de guardar. */
function limparSVG(svg){
  if (!svg || typeof svg !== 'string') return null;
  const i = svg.indexOf('<svg');
  const f = svg.lastIndexOf('</svg>');
  // Resposta cortada no meio: melhor nenhum desenho que um desenho quebrado.
  if (i === -1 || f === -1 || f < i) return null;
  return svg.slice(i, f + 6)
    .replace(/<script[\s\S]*?<\/script>/gi,'')
    .replace(/<image[^>]*>/gi,'')
    .replace(/\son\w+="[^"]*"/gi,'')
    .replace(/href\s*=\s*"(?!#)[^"]*"/gi,'');
}

/* --- tela de geração --- */
async function renderGerar(){
  const us = await carregarUnidades();
  if (!us.length) return ir('grade');

  const alvo = estado.trimestre;
  const extrasAgora = alvo === 0;
  const t = extrasAgora ? { id:0, tema:'Datas especiais', faixa:[0,0] }
                        : TRIMESTRES.find(x => x.id === alvo);
  const doTri = extrasAgora
    ? us.filter(u => u.tipo === 'extra').sort((a,b) => (a.ordem||0) - (b.ordem||0))
    : us.filter(u => u.tipo === 'ciclo'
        && u.numero >= t.faixa[0] && u.numero <= t.faixa[1]).sort((a,b) => a.numero - b.numero);

  const tarefas = [];
  doTri.forEach(u => faixasDaUnidade(u).forEach(fid => {
    const j = (u.licoes || []).find(l => l.faixa_id === fid);
    if (!j || j.status === 'pendente') tarefas.push({ u, fid });
  }));
  const total = doTri.reduce((n,u) => n + faixasDaUnidade(u).length, 0);

  moldura(`
    <p class="eyebrow">Lições e materiais das cinco faixas</p>
    <h1>Gerar o trimestre</h1>
    ${motorPronto() ? `<div class="aviso"><strong>O motor ainda não está ligado</strong>
       ${esc(motorPronto())}</div>` : ''}
    <p class="lede">Cada lição é escrita e salva individualmente. Se a fila for
      interrompida, nada se perde: ao voltar, ela recomeça de onde parou.</p>

    <div class="tabs" role="tablist">${
      TRIMESTRES.map(x => `<button class="tab" role="tab"
        aria-selected="${x.id === alvo}" data-tri="${x.id}">
        <span class="n">${pad(x.faixa[0])}–${pad(x.faixa[1])}</span>${esc(x.tema)}</button>`).join('')}
      <button class="tab" role="tab" aria-selected="${extrasAgora}" data-tri="0">
        <span class="n">+5</span>Datas especiais</button>
    </div>

    <div class="bloco">
      <h3 data-n="${extrasAgora ? '★' : pad(alvo)}">${esc(t.tema)}</h3>
      <dl class="meta">
        <dt>Lições do trimestre</dt><dd>${total}</dd>
        <dt>Já geradas</dt><dd>${total - tarefas.length}</dd>
        <dt>Pendentes</dt><dd>${tarefas.length}</dd>
      </dl>
      <p style="color:var(--ink-soft);font-size:13.5px;margin:12px 0 0">
        ${extrasAgora
          ? 'As cinco datas especiais recebem lição em todas as faixas, inclusive no Berçário.'
          : 'O Berçário recebe uma lição por bloco de quatro domingos, repetida nas quatro semanas — por isso o total não é 13 × 5.'}</p>
    </div>

    <div class="linha">
      <button class="btn gold" id="iniciar" ${tarefas.length ? '' : 'disabled'}>
        ${tarefas.length ? `Gerar ${tarefas.length} lições` : 'Trimestre completo'}</button>
      <button class="btn ghost" id="parar" style="display:none">Parar</button>
      <button class="btn ghost" data-ir="inicio">Voltar</button>
    </div>

    <div class="bloco">
      <h3 data-n="✓">Aprovar e publicar em lote</h3>
      <p style="color:var(--ink-soft);font-size:13.5px;margin:0 0 12px">
        Aprovar não libera nada para os professores — só publicar libera. Revise
        antes: uma vez publicada, a lição aparece na tela da faixa.</p>
      <div class="linha" style="margin:0">
        <button class="btn ghost sm" id="aprovar-lote">Aprovar todas as geradas</button>
        <button class="btn gold sm" id="publicar-lote">Publicar todas as aprovadas</button>
      </div>
    </div>

    <div id="painel" class="oculto">
      <div class="barra"><div id="preenche"></div></div>
      <pre id="registro" class="registro"></pre>
    </div>`, [ {t:'Início', ir:'inicio'}, {t:'Gerar'} ]);

  app.querySelectorAll('[data-tri]').forEach(b => {
    b.onclick = () => { estado.trimestre = +b.dataset.tri; renderGerar(); };
  });

  const emLote = async (de, para, rotulo, botao) => {
    const ids = doTri.map(u => u.id);
    botao.disabled = true; botao.textContent = 'Aplicando…';
    const campo = para === 'aprovada' ? 'aprovada_em' : 'publicada_em';
    const { data, error } = await sb.from('licoes')
      .update({ status: para, [campo]: new Date().toISOString(),
                atualizado_em: new Date().toISOString() })
      .in('unidade_id', ids).eq('status', de).select('id');
    if (error) alert('Não foi possível: ' + error.message);
    else alert(`${data?.length || 0} lições passaram para ${rotulo}.`);
    estado.cache.unidades = null;
    renderGerar();
  };
  const btnAp = $('#aprovar-lote');
  if (btnAp) btnAp.onclick = () => emLote('gerada','aprovada','aprovadas', btnAp);
  const btnPub = $('#publicar-lote');
  if (btnPub) btnPub.onclick = () => emLote('aprovada','publicada','publicadas', btnPub);

  const btn = $('#iniciar'), btnParar = $('#parar');
  if (!btn) return;
  btn.onclick = async () => {
    const falta = motorPronto();
    if (falta) return alert(falta);
    let parar = false;
    btn.disabled = true; btn.textContent = 'Gerando…';
    btnParar.style.display = ''; btnParar.onclick = () => { parar = true; btnParar.textContent = 'Parando…'; };
    $('#painel').classList.remove('oculto');
    const reg = $('#registro'), pre = $('#preenche');
    const anotar = m => { reg.textContent += m + '\n'; reg.scrollTop = reg.scrollHeight; };

    let feitas = 0, erros = 0;
    for (const tarefa of tarefas){
      if (parar){ anotar('— interrompido por você —'); break; }
      const faixa = FAIXAS.find(f => f.id === tarefa.fid);
      try{
        await gerarLicao(tarefa.u, faixa, anotar);
        feitas++;
      }catch(e){
        erros++; anotar(`✗ ${faixa.nome} · ${tarefa.u.titulo}: ${e.message}`);
      }
      pre.style.width = Math.round(((feitas+erros)/tarefas.length)*100) + '%';
    }
    anotar(`\nConcluído: ${feitas} lições geradas${erros ? `, ${erros} com erro` : ''}.`);
    estado.cache.unidades = null;
    btnParar.style.display = 'none';
    btn.disabled = false; btn.textContent = 'Atualizar';
    btn.onclick = () => renderGerar();
  };
}

/* --- ações sobre uma lição já gerada --- */
async function mudarStatus(licaoId, status){
  const campo = status === 'aprovada' ? 'aprovada_em'
              : status === 'publicada' ? 'publicada_em' : null;
  const patch = { status, atualizado_em: new Date().toISOString() };
  if (campo) patch[campo] = new Date().toISOString();
  const { error } = await sb.from('licoes').update(patch).eq('id', licaoId);
  if (error) return alert('Não foi possível atualizar: ' + error.message);
  estado.cache.unidades = null;
  renderLicao();
}

async function regerarLicao(licaoId, unidadeId, faixaId){
  if (!confirm('Regerar esta lição? A versão atual fica guardada no histórico.')) return;
  const { data: atual } = await sb.from('licoes').select('*').eq('id', licaoId).single();
  if (atual){
    await sb.from('licoes_versoes').insert({
      licao_id: licaoId, versao: atual.versao || 1, conteudo: atual });
    await sb.from('licoes').update({ versao: (atual.versao || 1) + 1 }).eq('id', licaoId);
  }
  const us = await carregarUnidades();
  const u = us.find(x => x.id === unidadeId);
  const faixa = FAIXAS.find(f => f.id === faixaId);
  moldura('<div class="carregando">Regerando a lição…</div>');
  try{
    await gerarLicao(u, faixa, () => {});
    estado.cache.unidades = null;
    renderLicao();
  }catch(e){
    alert('Falhou: ' + e.message); renderLicao();
  }
}

function montarLicao(u, faixa, l, mats, partes){
  let h = '';
  if (partes.ficha)   h += pecaFicha(u, faixa, l);
  if (partes.aluno)   h += pecaAluno(u, faixa, l);
  if (partes.mats)    h += (mats || []).map(m => pecaMaterial(u, faixa, m)).join('');
  if (partes.familia) h += pecaFamilia(u, faixa, l);
  return h;
}

function imprimir(html){
  if (!html.trim()) return alert('Não há nada para imprimir nesta seleção.');
  const alvo = document.getElementById('imprimir');
  alvo.innerHTML = html;
  const limpar = () => { alvo.innerHTML = ''; window.removeEventListener('afterprint', limpar); };
  window.addEventListener('afterprint', limpar);
  setTimeout(() => window.print(), 120);   // deixa as imagens assentarem
}

/* Trimestre inteiro de uma faixa, na ordem dos domingos. */
async function imprimirTrimestre(faixa, trimestre){
  const us = await carregarUnidades();
  const t = TRIMESTRES.find(x => x.id === trimestre);
  let alvos = us.filter(u => u.tipo === 'ciclo'
    && u.numero >= t.faixa[0] && u.numero <= t.faixa[1]).sort((a,b) => a.numero - b.numero);
  if (faixa.id === 1) alvos = alvos.filter(u => faixasDaUnidade(u).includes(1));

  const ids = alvos.map(u => u.id);
  const { data: licoes } = await sb.from('licoes').select('*')
    .in('unidade_id', ids).eq('faixa_id', faixa.id);
  const visiveis = (licoes || []).filter(l =>
    estado.papel === 'professor' ? l.status === 'publicada' : l.status !== 'pendente');
  if (!visiveis.length) return alert('Nenhuma lição disponível neste trimestre ainda.');

  const { data: mats } = await sb.from('materiais').select('*')
    .in('licao_id', visiveis.map(l => l.id)).order('ordem');

  let html = '';
  for (const u of alvos){
    const l = visiveis.find(x => x.unidade_id === u.id);
    if (!l) continue;
    html += montarLicao(u, faixa, l, (mats || []).filter(m => m.licao_id === l.id),
                        { ficha:true, aluno:true, mats:true, familia:true });
  }
  imprimir(html);
}

/* ---------- roteador ---------- */
function ir(tela, arg){
  estado.tela = tela;
  if (tela === 'faixa' && arg) estado.faixa = arg;
  if (tela === 'licao' && arg) estado.licaoId = arg;
  render();
}

async function render(){
  if (!estado.papel) return renderPorta();

  if (!configurado()){
    return moldura(`
      <div class="aviso"><strong>Falta configurar o Supabase</strong>
        Abra o index.html, preencha SUPABASE_URL e SUPABASE_KEY no bloco CONFIG
        e faça o commit. Rode o schema.sql no projeto antes.</div>
      <h1>Rede de Crianças</h1>
      <p class="lede">O app está no ar, mas ainda não sabe onde buscar o material.</p>`);
  }

  if (estado.papel === 'professor'){
    estado.faixa = estado.faixaPin;
    if (!['faixa','licao'].includes(estado.tela)) estado.tela = 'faixa';
  }

  try{
    if (estado.tela === 'inicio')  return await renderInicio();
    if (estado.tela === 'faixa')   return await renderFaixa();
    if (estado.tela === 'licao')   return await renderLicao();
    if (estado.tela === 'grade')   return await renderGrade();
    if (estado.tela === 'gerar')
      return estado.papel === 'admin' ? await renderGerar() : await renderInicio();
    if (estado.tela === 'moldes')  return renderMoldes();
    return await renderInicio();
  }catch(e){
    console.error(e);
    moldura(`<div class="aviso"><strong>Não foi possível carregar</strong>
      ${esc(e.message || e)}</div>
      <button class="btn ghost" data-ir="inicio">Tentar de novo</button>`);
  }
}

/* ---------- nada de falha silenciosa ----------
   Qualquer erro não tratado vira uma faixa visível no rodapé, para não
   voltar a acontecer de um botão simplesmente não responder. */
function mostrarFalha(msg){
  let f = document.getElementById('falha');
  if (!f){
    f = document.createElement('div');
    f.id = 'falha';
    f.onclick = () => f.remove();
    document.body.appendChild(f);
  }
  f.textContent = '⚠ ' + msg + '  (toque para fechar)';
}
window.addEventListener('error', e => mostrarFalha(e.message || 'erro desconhecido'));
window.addEventListener('unhandledrejection', e =>
  mostrarFalha(e.reason?.message || String(e.reason || 'promessa rejeitada')));

/* ---------- manifesto PWA embutido ---------- */
/* Os caminhos precisam ser absolutos: o manifesto é servido como Blob,
   e um caminho relativo seria resolvido contra a URL do Blob, não do site. */
const abs = arq => new URL(arq, location.href).href;
const manifesto = {
  name:'Currículo da Rede de Crianças', short_name:'Rede de Crianças',
  description:'Material do Departamento Infantil da Igreja Vidas',
  start_url:'.', scope:'.', display:'standalone', orientation:'portrait',
  background_color:'#0F1B33', theme_color:'#0F1B33', lang:'pt-BR',
  icons:[
    { src:abs('icone-192.png'), sizes:'192x192', type:'image/png', purpose:'any' },
    { src:abs('icone-512.png'), sizes:'512x512', type:'image/png', purpose:'any' },
    { src:abs('icone-512.png'), sizes:'512x512', type:'image/png', purpose:'maskable' }
  ]
};
const linkMan = document.createElement('link');
linkMan.rel = 'manifest';
linkMan.href = URL.createObjectURL(new Blob([JSON.stringify(manifesto)], { type:'application/manifest+json' }));
document.head.appendChild(linkMan);

render();
</script>
